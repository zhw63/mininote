name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          autoconf-archive \
          libtool \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          automake

    - name: Install Buildozer and python-for-android
      run: |
        pip install --upgrade pip setuptools wheel
        pip install --upgrade buildozer
        pip install --upgrade "python-for-android>=2024.01.21"

    - name: Patch p4a pip upgrade (fallback)
      run: |
        P4A_PATH=$(python -c "import pythonforandroid; print(pythonforandroid.__path__[0])")
        if [ -f "$P4A_PATH/build.py" ]; then
          sed -i "s/pip install -U pip/pip install 'pip<26'/g" "$P4A_PATH/build.py" || true
        fi
        if [ -f "$P4A_PATH/toolchain.py" ]; then
          sed -i "s/pip install -U pip/pip install 'pip<26'/g" "$P4A_PATH/toolchain.py" || true
        fi

    - name: Cache buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK
      run: |
        buildozer android debug
      env:
        ANDROID_SDK_HOME: ${{ runner.temp }}/android-sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mininote-apk
        path: bin/*.apk
